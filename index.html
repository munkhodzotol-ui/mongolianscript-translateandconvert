<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MB-Bridge | Instant Mongolian Script Converter</title>
  
  <!-- Noto Sans Mongolian Font for Vertical Text Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h1 { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 4px; color: #1e293b; }
    .subtitle { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 24px; }
    label { font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 8px; }
    textarea { width: 100%; height: 110px; padding: 12px; font-size: 1rem; border: 1.5px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #2563eb; }
    
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .copy-btn { background: #2563eb; color: #ffffff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .copy-btn:hover { background: #1d4ed8; }
    
    .output-box {
      width: 100%; height: 260px; border: 1.5px solid #10b981; background: #f0fdf4; border-radius: 10px; padding: 16px; overflow-x: auto;
      font-family: 'Noto Sans Mongolian', sans-serif; font-size: 1.6rem; line-height: 1.8;
      writing-mode: vertical-lr; -webkit-writing-mode: vertical-lr;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MB-Bridge</h1>
    <p class="subtitle">Instant Cyrillic to Traditional Mongolian Script Converter</p>

    <label for="input">Cyrillic Input:</label>
    <textarea id="input" placeholder="Бичвэрээ энд оруулна уу (д.н. Монгол хэл сайхан)..."></textarea>

    <div class="output-header">
      <label>Traditional Mongolian Output:</label>
      <button class="copy-btn" id="copyBtn">Copy Script</button>
    </div>
    <div id="output" class="output-box"></div>
  </div>

  <script>
    // 1. Direct dictionary mapping for frequent words & foreign loanwords
    const dictionary = {
      "монгол": "ᠮᠣᠩᠭᠣᠯ", "хэл": "ᠬᠡᠯᠡ", "сайхан": "ᠰᠠᠢᠬᠠᠨ",
      "хаан": "ᠬᠠᠭᠠᠨ", "сургууль": "ᠰᠤᠷᠭᠠᠭᠤᠯᠢ", "улс": "ᠤᠯᠤᠰ",
      "сайн": "ᠰᠠᠶᠢᠨ", "байна": "ᠪᠠᠶᠢᠨ᠎ᠠ", "уу": "ᠤᠤ",
      "би": "ᠪᠢ", "чи": "ᠴᠢ", "багш": "ᠪᠠᠭᠰᠢ", "ном": "ᠨᠣᠮ",
      "хүүхэд": "ᠬᠡᠦᠬᠡᠳ", "өдөр": "ᠥᠳᠥᠷ", "аав": "ᠠᠪᠤ", "ээж": "ᠡᠵᠡ",
      // Common Foreign Loanwords (Galik Rules)
      "кино": "ᠺᠢᠨᠣ",
      "компьютер": "ᠺᠣᠮᠫᠢᠶᠦ᠋ᠲᠡᠷ",
      "телефон": "ᠲᠡᠯᠡᠹᠣᠨ",
      "америк": "ᠠᠮᠡᠷᠢᠺᠠ",
      "россия": "ᠣᠷᠣᠰ",
      "технологи": "ᠲᠡᠬᠡᠨᠣᠯᠣᠭᠢ",
      "спорт": "ᠰᠫᠣᠷᠲ"
    };

    // 2. Character fallback rule engine including foreign letters
    const charMap = {
      'а':'ᠠ','б':'ᠪ','в':'ᠸ','г':'ᠭ','д':'ᠳ','е':'ᠶᠡ','ё':'ᠶᠣ',
      'ж':'ᠵ','з':'ᠵ','и':'ᠢ','й':'ᠢ','к':'ᠺ','л':'ᠯ','м':'ᠮ',
      'н':'ᠨ','о':'ᠣ','ө':'ᠥ','п':'ᠫ','р':'ᠷ','с':'ᠰ','т':'ᠲ',
      'у':'ᠤ','ү':'ᠦ','ф':'ᠹ','х':'ᠬ','ц':'ᠴ','ч':'ᠴ','ш':'ᠱ',
      'э':'ᠡ','ю':'ᠶᠦ','я':'ᠶᠠ',
      'ы':'ᠢ', 'ь':'', 'ъ':'', 'щ':'ᠱ'
    };

    function convertWord(word) {
      const clean = word.toLowerCase();
      if (dictionary[clean]) return dictionary[clean];
      return clean.split('').map(char => charMap[char] || char).join('');
    }

    function convertText(text) {
      return text.split(/(\s+)/).map(token => {
        if (/^\s+$/.test(token)) return token;
        return convertWord(token);
      }).join('');
    }

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    // Real-time conversion trigger
    input.addEventListener('input', () => {
      output.innerText = convertText(input.value);
    });

    // Copy function
    copyBtn.addEventListener('click', () => {
      if (!output.innerText) return;
      navigator.clipboard.writeText(output.innerText);
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = "Copy Script", 1500);
    });
  </script>

</body>
</html>
