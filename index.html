<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MB-Bridge | Instant Mongolian Script Converter</title>
  
  <!-- Noto Sans Mongolian Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">

  <!-- html2canvas Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h1 { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 4px; color: #1e293b; }
    .subtitle { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 12px; }
    .status-badge { text-align: center; font-size: 0.75rem; margin-bottom: 20px; font-weight: 600; color: #059669; }
    label { font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 8px; }
    textarea { width: 100%; height: 110px; padding: 12px; font-size: 1rem; border: 1.5px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #2563eb; }
    
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn-group { display: flex; gap: 8px; }
    
    .action-btn { background: #2563eb; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .action-btn:hover { background: #1d4ed8; }
    
    .download-btn { background: #059669; }
    .download-btn:hover { background: #047857; }
    
    .output-box {
      width: 100%; height: 260px; border: 1.5px solid #10b981; background: #f0fdf4; border-radius: 10px; padding: 16px; overflow-x: auto;
      font-family: 'Noto Sans Mongolian', sans-serif; font-size: 1.6rem; line-height: 1.8;
      writing-mode: vertical-lr; -webkit-writing-mode: vertical-lr;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MB-Bridge</h1>
    <p class="subtitle">Instant Cyrillic to Traditional Mongolian Script Converter</p>
    <div id="status" class="status-badge">⏳ Loading 12,000+ Word Dictionary...</div>

    <label for="input">Cyrillic Input:</label>
    <textarea id="input" placeholder="Бичвэрээ энд оруулна уу..."></textarea>

    <div class="output-header">
      <label>Traditional Mongolian Output:</label>
      <div class="btn-group">
        <button class="action-btn" id="copyBtn">Copy Script</button>
        <button class="action-btn download-btn" id="downloadBtn">Download PNG</button>
      </div>
    </div>
    <div id="output" class="output-box"></div>
  </div>

  <script>
    let dictionary = {};

    async function loadDictionary() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch('./dictionary_clean.json');
        if (!response.ok) throw new Error("Could not find dictionary_clean.json");
        dictionary = await response.json();
        const wordCount = Object.keys(dictionary).length.toLocaleString();
        statusEl.innerText = `✓ Loaded ${wordCount} Dictionary Words`;
      } catch (err) {
        console.warn("Local fetch restricted or file missing. Using fallback rule engine.", err);
        statusEl.innerText = "⚠️ Running on Fallback Rule Engine";
        statusEl.style.color = "#d97706";
      }
    }

    loadDictionary();

    const NNBSP = "\u202F"; 

    const suffixRules = [
      { cyr: "чууд", hudum: NNBSP + "ᠴᠤᠤᠳ" },
      { cyr: "чүүд", hudum: NNBSP + "ᠴᠦᠦᠳ" },
      { cyr: "чуул", hudum: NNBSP + "ᠴᠤᠤᠯ" },
      { cyr: "чүүл", hudum: NNBSP + "ᠴᠦᠦᠯ" },
      { cyr: "нар",  hudum: NNBSP + "ᠨᠠᠷ" },
      { cyr: "аа", hudum: "ᠠ" },
      { cyr: "ээ", hudum: "ᠡ" },
      { cyr: "оо", hudum: "ᠠ" },
      { cyr: "өө", hudum: "ᠡ" },
      { cyr: "ийг", hudum: NNBSP + "ᠢ" },
      { cyr: "ыг",  hudum: NNBSP + "ᠢ" },
      { cyr: "г",   hudum: NNBSP + "ᠶᠢ" },
      { cyr: "аас", hudum: NNBSP + "ᠠᠴᠠ" },
      { cyr: "ээс", hudum: NNBSP + "ᠡᠴᠡ" },
      { cyr: "оос", hudum: NNBSP + "ᠠᠴᠠ" },
      { cyr: "өөс", hudum: NNBSP + "ᠡᠴᠡ" },
      { cyr: "аар", hudum: NNBSP + "ᠪᠠᠷ" },
      { cyr: "ээр", hudum: NNBSP + "ᠢᠶᠡᠷ" },
      { cyr: "оор", hudum: NNBSP + "ᠪᠠᠷ" },
      { cyr: "өөр", hudum: NNBSP + "ᠢᠶᠡᠷ" },
      { cyr: "тай", hudum: NNBSP + "ᠲᠠᠢ" },
      { cyr: "тэй", hudum: NNBSP + "ᠲᠡᠢ" },
      { cyr: "той", hudum: NNBSP + "ᠲᠠᠢ" },
      { cyr: "руу", hudum: NNBSP + "ᠷᠤᠭᠤ" },
      { cyr: "рүү", hudum: NNBSP + "ᠷᠦᠭᠦ" },
      { cyr: "ийн", hudum: NNBSP + "ᠶᠢᠨ" },
      { cyr: "ын",  hudum: NNBSP + "ᠤᠨ" },
      { cyr: "д",   hudum: NNBSP + "ᠳᠤ" },
      { cyr: "т",   hudum: NNBSP + "ᠲᠤ" },
      { cyr: "сан", hudum: "ᠭᠰᠠᠨ" },
      { cyr: "сэн", hudum: "ᠭᠰᠡᠨ" },
      { cyr: "сон", hudum: "ᠭᠰᠠᠨ" },
      { cyr: "сөн", hudum: "ᠭᠰᠡᠨ" }
    ];

    const charMap = {
      'а':'ᠠ','б':'ᠪ','в':'ᠸ','г':'ᠭ','д':'ᠳ','е':'ᠶᠡ','ё':'ᠶᠣ',
      'ж':'ᠵ','з':'ᠵ','и':'ᠢ','й':'ᠢ','к':'ᠺ','л':'ᠯ','м':'ᠮ',
      'н':'ᠨ','о':'ᠣ','ө':'ᠥ','п':'ᠫ','р':'ᠷ','с':'ᠰ','т':'ᠲ',
      'у':'ᠤ','ү':'ᠦ','ф':'ᠹ','х':'ᠬ','ц':'ᠴ','ч':'ᠴ','ш':'ᠱ',
      'э':'ᠡ','ю':'ᠶᠦ','я':'ᠶᠠ','ы':'ᠢ','ь':'','ъ':'','щ':'ᠱ'
    };

    function getWordGender(word) {
      return /[аоуяё]/i.test(word) ? 'masculine' : 'feminine';
    }

    function convertByChar(str, gender) {
      let result = '';
      const chars = str.split('');
      for (let i = 0; i < chars.length; i++) {
        const char = chars[i];
        if (char === 'х') {
          result += (gender === 'masculine') ? '\u182A' : '\u182D';
          continue;
        }
        if (char === 'г') {
          result += '\u182D';
          continue;
        }
        if ((char === 'т' || char === 'ш' || char === 'д') && i === chars.length - 1) {
          result += (charMap[char] || char) + '\u1822';
          continue;
        }
        result += charMap[char] || char;
      }
      return result;
    }

    function convertWord(word) {
      const clean = word.toLowerCase();

      // 1. Check 12k Dictionary
      if (dictionary[clean]) return dictionary[clean];

      const gender = getWordGender(clean);

      // 2. Suffix Stripping Match
      for (const rule of suffixRules) {
        if (clean.endsWith(rule.cyr) && clean.length > rule.cyr.length) {
          const stem = clean.slice(0, clean.length - rule.cyr.length);
          let stemHudum = dictionary[stem];

          if (!stemHudum && stem.endsWith("и")) {
            const softStem = stem.slice(0, -1) + "ь";
            if (dictionary[softStem]) stemHudum = dictionary[softStem];
          }

          if (!stemHudum) stemHudum = convertByChar(stem, gender);
          return stemHudum + rule.hudum;
        }
      }

      // 3. Character Fallback
      return convertByChar(clean, gender);
    }

    function convertText(text) {
      return text.split(/(\s+)/).map(token => {
        if (/^\s+$/.test(token)) return token;
        return convertWord(token);
      }).join('');
    }

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    input.addEventListener('input', () => {
      output.innerText = convertText(input.value);
    });

    copyBtn.addEventListener('click', () => {
      if (!output.innerText) return;
      navigator.clipboard.writeText(output.innerText);
      copyBtn.innerText = "Copied!";
      setTimeout(() => copyBtn.innerText = "Copy Script", 1500);
    });

    downloadBtn.addEventListener('click', () => {
      if (!output.innerText.trim()) return;
      downloadBtn.innerText = "Generating...";
      html2canvas(output, { backgroundColor: '#f0fdf4', scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'mongolian-script.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        downloadBtn.innerText = "Download PNG";
      }).catch(err => {
        console.error('Export failed:', err);
        downloadBtn.innerText = "Download PNG";
      });
    });
  </script>
</body>
</html>
